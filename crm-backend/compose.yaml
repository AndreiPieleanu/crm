# Local development database. Values come from the .env file next to this one (copy .env.example).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${CRM_DB_ADMIN_PASSWORD:?set CRM_DB_ADMIN_PASSWORD in .env}
      CRM_DB_OWNER_PASSWORD: ${CRM_DB_OWNER_PASSWORD:?set CRM_DB_OWNER_PASSWORD in .env}
      CRM_DB_APP_PASSWORD: ${CRM_DB_APP_PASSWORD:?set CRM_DB_APP_PASSWORD in .env}
    ports:
      # Bound to localhost only, so the database is not reachable from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - crm-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  crm-pgdata:
